name: jazz-solo-gen
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - torch==2.3.1
      - transformers==4.44.2
      - sentence-transformers==3.0.1
      - miditok==3.1.1             # 3.1 changed pitch_range (see src/tokens/remi.py)
      - symusic==0.5.0
      - pretty_midi==0.2.10
      - mirdata==0.3.9
      - numpy==1.26.4
      - pandas==2.2.2
      - pyyaml==6.0.2
      - tqdm==4.66.5
      - google-genai==3.6.1        # Gemini captioning: batches, JSON-schema output
      - pyfluidsynth==1.3.3        # wrapper only; the fluidsynth program is separate (not on
                                   # conda-forge for Windows: use the GitHub release zip) and
                                   # src/render.py finds it on PATH or via $FLUIDSYNTH,
                                   # with a General MIDI .sf2 in $SOUNDFONT
      - matplotlib==3.9.2
      - wandb==0.17.9
      - pytest==8.3.2
